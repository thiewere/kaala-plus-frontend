<td>
    <span class="font-medium">{{ index() + 1 }}</span>
</td>
<td>
    <div class="flex items-center gap-2">
        <span>{{ value().reference }}</span>
    </div>
</td>
<td>
    <div class="flex items-center gap-2">
        <span class="text-sm">{{ value().clientFirstname + ' ' +  value().clientLastname}}</span>
    </div>
</td>
<td>
    <div class="flex items-center gap-2">
        <span class="text-sm">{{ value().description }}</span>
    </div>
</td>
<td>
    <div class="flex items-center gap-2">
        <span class="text-sm">{{ value().createdAt }}</span>
    </div>
</td>
<td>
    <div class="flex items-center gap-2">
        <button
            pButton
            type="button"

            size="small"
            class="!bg-cyan-800 !text-amber-200 hover:!bg-cyan-900 hover:!text-amber-300"
            
            >
            <span pButtonLabel>Compléter</span>
           <svg data-p-icon="arrow-up-right" [size]="16"></svg>
        </button>
    </div>
</td>
