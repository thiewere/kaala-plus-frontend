<div>
    <div class=" rounded-md p-3  text-2xl shadow-xl bg-cyan-800 text-yellow-100 mb-5">
        <h1>Dashboard</h1>
    </div>

    <section class="mb-5 max-w-300 m-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        @for (card of cards(); track $index) {
            <app-dashboard-card [card]="card"/>
        }
    </section>

    <section class="bg-amber-100 rounded-lg border border-cyan-900 shadow-sm overflow-hidden">

        <div class="flex justify-between items-center text-cyan-900 p-3 border-b border-cyan-900">
            <div>
                <div class="flex gap-3">
                    <h2 class="text-lg font-semibold ">Commandes à compléter </h2>
                    <span class="pl-3 pr-3 bg-cyan-900 rounded-xl text-sm flex items-center text-amber-200 ">{{pendingOrders()?.length}} en attente</span>
                </div>
                <span class="text-sm">Commandes enregistrées en attente de détails produits</span>
            </div>
            <span>
                <svg data-p-icon="list-check" [size]="32"></svg>
            </span>
        </div>

        <p-table [value]="pendingOrders()" 
            stripedRows 
            class="orders-table shadow-lg "
            [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                    <th >#</th>
                    <th >Référence</th>
                    <th >Client</th>
                    <th >Description</th>
                    <th >Date</th>
                    <th >Action</th>
            </tr>
        </ng-template>
        <ng-template #body let-order let-rowIndex="rowIndex">
            <tr app-dashboard-item [value]="order" [index]="rowIndex" ></tr>
        </ng-template>
    </p-table>
    </section>
</div>
