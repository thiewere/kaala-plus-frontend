<div>
    <app-header [header]="headerData()" />

    <app-recherche-add [value]="searchAddFieldData()" />

    <p-table [value]="suppliers()" stripedRows class="orders-table shadow-lg rounded-md overflow-hidden mx-auto" [tableStyle]="{ 'min-width': '50rem', 'text-align': 'center' }">
        <ng-template #header >
            <tr class="font-semibold text-xl">
                    <th>#</th>
                    <th>Nom</th>
                    <th>Téléphone</th>
                    <th>Addresse</th>
                    <th>Produit</th>
                    <th>Prix Unitaire</th>
                </tr>
        </ng-template>
        <ng-template #body let-supplier let-rowIndex="rowIndex">
          <tr app-supplier-item [value]="supplier" [index]="rowIndex" ></tr>
        </ng-template>
    </p-table>
</div>
