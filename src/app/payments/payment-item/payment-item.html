<td> {{ index() + 1 }} </td>

@let order = value().order;
<td> {{ order.reference }} </td>
<td> {{ order.client.firstname + ' ' + order.client.lastname }} </td>
<td> {{ value().paymentType }} </td>
<td> {{ value().amount | currency:`${value().currency.name} `}} </td>
<td> {{ value().paymentDate }} </td>
<td> {{ value().note }} </td>
