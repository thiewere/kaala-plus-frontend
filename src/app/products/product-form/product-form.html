<ng-template #supplierProductFormTemplate>
    <form [formGroup]="form">
        <section class="rounded-xl border border-stone-200 p-6 mb-2">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">
                Information du produit
            </h2>

            <div class="flex flex-wrap gap-6 mb-6">
                <div class="flex items-center gap-2">
                    <p-radiobutton
                        inputId="newProduct"
                        name="productMode"
                        value="new"
                        formControlName="productMode"
                    />
                    <label for="newProduct" class="cursor-pointer">Nouveau produit</label>
                </div>

                <div class="flex items-center gap-2">
                    <p-radiobutton
                        inputId="existingProductRadio"
                        name="productMode"
                        value="existing"
                        formControlName="productMode"
                    />
                    <label for="existingProductRadio" class="cursor-pointer" >Produit existant</label>
                </div>
            </div>

            @if (form.controls.productMode.value === 'new') {
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="flex flex-col gap-2">
                        <label for="productName" class="font-medium">Nom du produit <span class="text-red-500">*</span></label>
                        <input pInputText
                            id="productName"
                            formControlName="name"
                            placeholder="Ex. Machine à laver X100 8kg">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label for="productBrand" class="font-medium">Marque</label>
                        <input pInputText
                            id="productBrand"
                            formControlName="brand"
                            placeholder="Ex. LG">
                    </div>

                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label for="productDescription" class="font-medium">Description</label>
                        <textarea pInputText
                            id="productDescription"
                            formControlName="description"
                            rows="3"
                            placeholder="Description du produit ...">
                        </textarea>
                    </div>
                </div>
            } @else {
                <div class="flex flex-col gap-2">
                   <label for="existingProduct" class="cursor-pointer font-medium">
                        Sélectionner un produit existant
                        <span class="text-red-500">*</span>
                    </label> 

                   <p-autocomplete
                        inputId="existingProduct"
                        formControlName="selectedProduct"
                        [suggestions]="filteredProducts()"
                        (completeMethod)="searchProduct($event)"
                        (onSelect)="onProductSelect($event)"
                        (onClear)="onProductFieldClear()"
                        optionLabel="name"
                        [dropdown]="true"
                        [forceSelection]="true"
                        placeholder="Rechercher un produit..."
                        inputStyleClass="w-full"
                        />
                </div>
            }
        </section>

        <section class="rounded-xl border border-stone-200 p-6">
            <h2 class="text-lg font-semibold text-cyan-900 mb-5">
                Information du fournisseur
            </h2>

            <div class="flex flex-wrap gap-6 mb-6">
                @for (mode of modeSuppliers; track mode.value) {
                    <div class="flex items-center gap-2">
                        <p-radiobutton 
                            [inputId]="'supplier-' + mode.value"
                            name="supplierMode"
                            [value]="mode.value"
                            formControlName="supplierMode"
                        />
                        <label [for]="'supplier-' + mode.value" class="cursor-pointer">
                            {{ mode.label }}
                        </label>
                    </div>
                }
            </div>

            @if (form.controls.supplierMode.value === 'new') {
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                   <div class="flex flex-col gap-2">
                        <label for="supplierName" class="cursor-pointer font-medium">Nom du Fournisseur <span class="text-red-500">*</span></label>
                        <input pInputText
                            id="supplierName"
                            formControlName="supplierName"
                            placeholder="Ex. Guangzhou electronics Ltd"
                        >
                   </div>

                   <div class="flex flex-col gap-2">
                        <label for="supplierPhone" class="cursor-pointer font-medium">Téléphone <span class="text-red-500">*</span></label>
                        <input pInputText
                            id="supplierPhone"
                            formControlName="supplierPhone"
                            placeholder="Ex. +8613800000000"
                        >
                   </div>

                   <div class="flex flex-col gap-2">
                        <label for="supplierAddress" class="cursor-pointer font-medium">Adresse</label>
                        <input pInputText
                            id="supplierAddress"
                            formControlName="supplierAddress"
                            placeholder="Ex. Guangzhou, China"
                        >
                   </div>
                </div>
            }@else {
                <div class="flex flex-col gap-2">
                   <label for="existingSupplier" class="cursor-pointer font-medium">
                        Sélectionner un fournisseur
                        <span class="text-red-500">*</span>
                    </label> 

                   <p-autocomplete
                        inputId="existingSupplier"
                        formControlName="selectedSupplier"
                        [suggestions]="filteredSuppliers()"
                        (completeMethod)="searchSupplier($event)"
                        (onSelect)="onSupplierSelect($event)"
                        (onClear)="onSupplierFieldClear()"
                        optionLabel="name"
                        [dropdown]="true"
                        [forceSelection]="true"
                        placeholder="Rechercher un fournisseur..."
                        inputStyleClass="w-full"
                        />
                </div>
            }   
        </section>
    </form>
</ng-template>

@if (dialogMode()) {
    <ng-container
        *ngTemplateOutlet="supplierProductFormTemplate">
        
    </ng-container>
} @else {
    <div>
        <app-header [header]="headerData()" />
        <p-card>
            <ng-template
             *ngTemplateOutlet="supplierProductFormTemplate">

            </ng-template>
        </p-card>
    </div>
}
