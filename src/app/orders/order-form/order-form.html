<div>
    <app-header [header]="headerData()"/>

    <p-card class="flex justify-center">
        @if (!selectedClient) {
            <div class="flex flex-col ">
                <label pLabel class="mb-3">Rechercher un client</label>
                <div class="grid grid-cols-[1fr_auto] gap-3">
                    <p-autocomplete 
                        [(ngModel)]="searchValue"
                        [suggestions]="filteredItems"
                        (completeMethod)="search($event)"
                        (onSelect)="selectClient($event)"
                        optionLabel="firstname"
                        placeholder="Rechercher..." 
                        inputStyleClass="w-full">
                        
                        <ng-template #item let-client>
                            <div class="flex flex-col">
                                <span class="font-medium">
                                    {{ client.firstname }} {{ client.lastname }}
                                </span>
                                <span class="text-sm text-gray-500">
                                    {{ client.phone }} · {{ client.country }}
                                </span>
                            </div>
                        </ng-template>
                    </p-autocomplete>  
                    <button type="button" pButton (click)="showDialog = true">Nouveau client</button>
                    
                </div>       
            </div>
        }@else {
            <div>
                <div class="mb-5">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="flex items-center justify-center size-7 rounded-full bg-cyan-800 text-amber-100 font-semibold">
                            1
                        </span>

                        <h2 class="font-semibold text-shadow-cyan-950 uppercase">
                            Client
                        </h2>
                    </div>
                    
                    <div class="flex items-center justify-between p-4 rounded-lg border border-cyan-800 bg-cyan-50">
                        <div>
                            <p class="font-semibold text-cyan-950">
                                {{ selectedClient.firstname }} {{ selectedClient.lastname }}
                            </p>

                            <p class="text-sm text-gray-600">
                                {{ selectedClient.phone }} · {{ selectedClient.country }}
                            </p>
                        </div>

                        <button
                            type="button"
                            (click)="changeClient()"
                            class="px-3 py-2 rounded-md border border-cyan-800 text-cyan-800 cursor-pointer hover:bg-cyan-800 hover:text-yellow-100 hover:border-yellow-100"
                            >
                            Changer
                        </button>
                    </div>
                </div>

            </div>
        }
    </p-card>

</div>
