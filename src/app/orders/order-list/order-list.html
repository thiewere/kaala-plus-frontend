<div>
   
    <app-header [header]="headerData()"/>

    <app-recherche-add [value]="searchAddFieldData()"/>

    <p-table [value]="orders()" 
            stripedRows 
            class="orders-table shadow-lg "
            [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                    <th >#</th>
                    <th >Référence</th>
                    <th >Client</th>
                    <th >Date</th>
                    <th >Montant total</th>
                    <th >Montant payé</th>
                    <th >Reste à payer</th>
                    <th >Paiement</th>
                    <th >Statut</th>
                    <th >Conteneur</th>
                    <th >Action</th>
            </tr>
        </ng-template>
        <ng-template #body let-order>
            <tr app-order-item [order]="order"></tr>
        </ng-template>
    </p-table>

</div>
