<div class="mr-3">
   
    <app-header [header]="headerData()"/>

    <div class="bg-cyan-800 shadow-md mb-5 rounded-md p-3 flex justify-between items-center">
        <input type="text"
                name=""
                id="search"
                placeholder="Rechercher par nom"
                class="bg-yellow-100 w-100 p-2 rounded-md text-cyan-900"
                >
        <button pButton>
            Nouvelle commande
        </button>
    </div>

    <p-table [value]="orders()" 
            stripedRows 
            class="orders-table shadow-lg "
            [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                    <th >#</th>
                    <th >Référence</th>
                    <th >Client</th>
                    <th >Date</th>
                    <th >Montant total</th>
                    <th >Montant payé</th>
                    <th >Reste à payer</th>
                    <th >Paiement</th>
                    <th >Statut</th>
                    <th >Conteneur</th>
                    <th >Action</th>
            </tr>
        </ng-template>
        <ng-template #body let-order>
            <tr app-order-item [order]="order"></tr>
        </ng-template>
    </p-table>

</div>
