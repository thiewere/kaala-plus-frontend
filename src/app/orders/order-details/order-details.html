<div>
    <app-header [header]="headerData()" />

    <p-card class="details-page">
        @if (orderDetails(); as order) {
            <nav class="flex flex-col gap-5">
                <span>
                    <a routerLink="/orders" class="text-cyan-700">Commandes</a>
                    <span class="mx-3">/</span>
                    <span>{{ order.reference }}</span>
                </span>
                <span>
                    <a
                        routerLink="/orders"
                        class="inline-flex items-center gap-2 text-sm font-medium text-cyan-800"
                    >
                        <svg data-p-icon="arrow-left" [size]="18"></svg>
                        Retour aux commandes
                    </a>
                </span>
            </nav>

            <header class="mb-6 mt-2">
                <h1 class=" font-bold text-cyan-900 md:text-3xl">
                    Commande {{ order.reference }}
                </h1>

                <p class="mt-2 text-sm text-slate-500">
                    Créée le {{ order.createdAt | date:'dd/MM/yyyy' }}
                </p>
            </header>

            <div class="grid grid-cols-1 items-start gap-5 xl:grid-cols-3">
               
            </div>
        } @else {
            <p class="p-6 text-slate-500">Chargement de la commande…</p>
        }
    </p-card>
</div>
